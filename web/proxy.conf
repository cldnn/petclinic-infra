<VirtualHost *:80>
    # 웹 계층에서 본 직전 홉(외부 ALB 노드) IP. 시연용 확인 헤더.
    RequestHeader set X-Demo-Web-Alb-IP "expr=%{CONN_REMOTE_ADDR}"

    ProxyAddHeaders On
    ProxyPreserveHost On

    # /petclinic 으로 들어오면 /petclinic/ 으로 이동
    RewriteEngine On
    RewriteRule ^/petclinic$ https://%{HTTP_HOST}/petclinic/ [R=301,L]

    # ttl=55: ALB 유휴 제한 시간(60초)보다 먼저 연결을 닫는다.
    # addressttl=30: ALB IP가 바뀌어도 30초 안에 DNS를 다시 조회한다.
    ProxyPass        "/petclinic/" "http://<INTERNAL_ALB_DNS>/petclinic/" ttl=55 addressttl=30
    ProxyPassReverse "/petclinic/" "http://<INTERNAL_ALB_DNS>/petclinic/"
</VirtualHost>
