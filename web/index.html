<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Clinic - 서비스 안내</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background-color: #f4f7f6;
color: #333;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
.container {
background: #ffffff;
padding: 40px 30px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
text-align: center;
max-width: 420px;
width: 90%;
}
.icon {
font-size: 54px;
margin-bottom: 20px;
}
h1 {
font-size: 22px;
font-weight: 700;
color: #2c3e50;
margin-bottom: 12px;
}
p {
font-size: 14px;
color: #666;
line-height: 1.6;
margin-bottom: 28px;
}
.btn {
display: inline-block;
background-color: #3182ce;
color: #ffffff;
text-decoration: none;
padding: 14px 28px;
border-radius: 8px;
font-size: 15px;
font-weight: 600;
transition: background-color 0.2s ease, transform 0.1s ease;
}
.btn:hover {
background-color: #2b6cb0;
transform: translateY(-1px);
}
.btn:active {
transform: translateY(0);
}
</style>
</head>
<body>
<div class="container">
<div class="icon">🐾</div>
<h1>Pet Clinic 서비스 안내</h1>
<p>아래 버튼을 누르시면 펫클리닉 메인 페이지로 이동합니다.</p>
<a href="/petclinic/" class="btn">메인 페이지로 이동하기</a>
</div>
</body>
</html>
